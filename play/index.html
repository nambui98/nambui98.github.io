<html lang="vi">

<title>Brick Game 9999 in 1 — preview</title>
<style>
  :root {
    /* Shell colours are overwritten from core/ShellConfig.ts (resolveShell) at runtime. */
    --backdrop: #3a2e0e;
    /* Safe areas. iOS fills these from env(); the Android shell overrides them from the
       window insets because its WebView reports env() as 0 even under a camera cutout. */
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --body: #f2c230;
    --body-edge: #b8891a;
    --body-highlight: #ffe07a;
    --print: #3a2e0e;
    --button: #2f9e8f;
    --button-edge: #1b6b60;
    --button-highlight: #7fd8c9;
    --small: #222;
    --bezel: #2b2b2b;
    --glass: #9ead86;
    --glass-edge: #7f8d6a;
    --ink: #1b1f1a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--backdrop); font-family: "Helvetica Neue", Arial, sans-serif;
    /* No pinch-zoom, double-tap zoom, text selection or pull-to-refresh while playing. */
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    /* dvh follows the mobile browser chrome. Only the side insets pad the page: the case
       itself runs under the notch and home bar, and its first/last rows keep the content clear. */
    min-height: 100dvh;
    padding: 0 var(--safe-right) 0 var(--safe-left);
  }
  /* The stage owns the 9:16 width formula and is the container that cqw units resolve
     against; container units used on an element resolve against its ancestor container,
     so they cannot be used on .console for its own rows. */
  .stage {
    width: min(100vw, 56.25vh); /* fallback for browsers without dvh */
    width: min(100vw - var(--safe-left) - var(--safe-right), 100dvh * 9 / 16);
    container-type: inline-size;
  }
  .console {
    position: relative; width: 100%;
    /* The classic shell is 9:16 (177.8cqw tall). Taller phones stretch the case up to 9:21.5
       instead of floating it in a dark band; the extra height goes to the header band and,
       twice as much, to the grip below the buttons, like the long lower case of the E-9999. */
    height: clamp(177.8cqw, 100vh, 225cqw);
    height: clamp(177.8cqw, 100dvh, 225cqw);
    display: grid; grid-template-rows: 8.5% 45% 3% 9% 26.5% 8%; padding: 0 4.5%;
    /* Rows in shell-width units: percentage rows + aspect-ratio children resolve
       differently on iOS Safari. */
    /* Tall phones: the stretch splits into a rest area under the screen (1.5), a gap between the
       small keys and the d-pad so thumbs never brush START (1), and thin header/base (0.5 each). */
    grid-template-rows: minmax(calc(11cqw + var(--safe-top)), 0.5fr) 86cqw 5cqw minmax(0, 1.5fr) 15cqw minmax(0, 1fr) 39cqw minmax(calc(21.8cqw + var(--safe-bottom)), 0.5fr);
    /* Type scales with the shell itself (cqw), never below a readable floor on small phones. */
    container-type: inline-size;

  .body {
    position: absolute; inset: 1.5% 2%; border-radius: 9% / 5%;
    /* Moulded plastic: lit from the top-left, a soft fall-off towards the base, a glossy
       rim on top and a warm shade underneath. All derived from the palette variables. */
    background:
      radial-gradient(120% 70% at 30% 0%, rgba(255,255,255,.22), rgba(255,255,255,0) 60%),
      linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 35%, rgba(0,0,0,0) 70%, rgba(0,0,0,.14) 100%),
      var(--body);
    border: 4px solid var(--body-edge);
    box-shadow:
      inset 0 3px 0 var(--body-highlight),

      inset 0 -10px 24px rgba(0,0,0,.14),
      0 20px 60px rgba(0,0,0,.5);
  }
  /* Taller than 9:17.5 the console is stretched to the viewport: the case meets all four
     screen edges, no dark band. The sides used to keep a 2% inset, which read as the app
     floating in a frame rather than being the device. Its own corner radius is squarer than
     any phone's, so the screen mask clips the case and no backdrop shows at the corners. */

  .brand { position: relative; z-index: 1; text-align: center; color: var(--print); font-weight: 800; letter-spacing: .08em; text-shadow: 0 1px 0 rgba(255, 240, 180, .35); }

    border: 3px solid var(--print); border-radius: 10px; margin: 0 0.5%; padding: 1.5% 1%;
    background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,0) 30%, rgba(255,255,255,.05));
    box-shadow: inset 0 2px 6px rgba(0,0,0,.10), 0 1px 0 rgba(255,255,255,.18);

  .foot-brand { transform: rotate(-6deg); transform-origin: left bottom; color: var(--print); text-shadow: 0 1px 0 rgba(255, 240, 180, .35); line-height: 1.1; }
  .foot-brand b { display: block; font-size: clamp(13px, 3vmin, 26px); font-size: clamp(13px, 5.6cqw, 26px); font-weight: 900; letter-spacing: .06em; font-style: italic; border-bottom: 3px solid var(--print); padding-bottom: 2px; text-shadow: 0 1px 0 rgba(255,255,255,.25), 0 -1px 0 rgba(0,0,0,.18); }
  .foot-brand small { display: block; font-size: clamp(8px, 1.6vmin, 13px); font-size: clamp(8px, 2.6cqw, 13px); font-weight: 700; letter-spacing: .12em; margin-top: 2px; }
  .mascot-wrap { display: flex; flex-direction: column; align-items: center; gap: .2em; }
  .mascot { width: clamp(32px, 10cqw, 60px); height: auto; image-rendering: pixelated; display: block; }
  .mascot-name { font-size: clamp(8px, 1.6vmin, 12px); font-size: clamp(8px, 2.2cqw, 12px); font-weight: 700; color: var(--print); letter-spacing: .06em; text-transform: uppercase; }
  /* Stickers layer: covers the whole shell so x/y/scale map 1:1 with the Cocos view. */
  /* During play stickers sit on the plastic under the screen and buttons and never take touches;
     in arrange mode the layer rises above everything and becomes draggable. */
  .stickers-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .stickers-layer.arranging { z-index: 3; pointer-events: auto; }
  .stickers-layer .sticker { pointer-events: none; }
  .stickers-layer.arranging .sticker { pointer-events: auto; }
  .stickers-layer .sticker img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none;
    border: 3px solid #fff; border-radius: 4px; box-shadow: 0 3px 8px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.12); box-sizing: border-box; }
  .stickers-layer .sticker.selected { outline: 2px dashed #fff; outline-offset: 4px; }
  /* Controls printed on the selected sticker: ✕ delete (top-left), ✓ done (top-right),
     ⟳ corner handle (bottom-right) — drag it to resize and rotate in one motion. */
  .sticker-badge {
    position: absolute; width: 34px; height: 34px; border-radius: 50%; padding: 0;
    border: 2px solid #2a2210; background: #f6f0dc; color: #2a2210; font-size: 16px; font-weight: 800; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .sticker-remove { top: -17px; left: -17px; }
  .sticker-ok { top: -17px; right: -17px; background: #2a2210; color: #f6f0dc; }
  .sticker-handle { bottom: -17px; right: -17px; cursor: grab; background: #ffd23f; font-size: 18px; }
  /* Settings card */
  /* Settings: a bottom sheet on phones, a centred card on wide screens. Header and tab bar stay

  .settings { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0); transition: background-color 220ms ease; }
  .settings.open { background: rgba(0,0,0,.6); }

  .settings .card { transform: translateY(100%); transition: transform 260ms cubic-bezier(.2, .8, .2, 1); will-change: transform; }
  .settings.open .card { transform: none; }
  @media (prefers-reduced-motion: reduce) { .settings, .settings .card { transition: none; } }
  .card {
    width: min(100vw, 480px); max-height: 92vh; max-height: calc(100dvh - var(--safe-top) - 12px);
    display: flex; flex-direction: column; overflow: hidden;
    background: #f6f0dc; color: #2a2210; border: 3px solid #2a2210; border-bottom: 0; border-radius: 20px 20px 0 0;
    padding: 0 0 var(--safe-bottom); font-weight: 700; letter-spacing: .02em; text-align: left;
  }
  @media (min-width: 700px) and (min-height: 700px) {
    .settings { align-items: center; }
    .card { border-bottom: 3px solid #2a2210; border-radius: 20px; max-height: min(90vh, 760px); }
    .settings .card { transform: translateY(24px); opacity: 0; transition: transform 220ms ease, opacity 220ms ease; }
    .settings.open .card { transform: none; opacity: 1; }

  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px 18px; }
  .card h2 { margin: 0; font-size: 17px; letter-spacing: .14em; }
  .close-x { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 50%; border: 2px solid #2a2210; background: transparent; color: #2a2210; font: inherit; font-size: 16px; line-height: 1; padding: 0; cursor: pointer; display: grid; place-items: center; }
  /* Six tabs across eleven locales never fit one row — PREDEFINIÇÕES alone is 13 characters.

  #custom-color, #glass-color { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #shell-name { font-size: 12px; opacity: .8; }

  .select-input { border: 2px solid #2a2210; border-radius: 10px; padding: 8px 36px 8px 12px; font: inherit; font-weight: 700; font-size: 16px; background: #f6f0dc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%232a2210' stroke-width='2'/></svg>") no-repeat right 12px center; color: #2a2210; -webkit-appearance: none; appearance: none; max-width: 260px; min-width: 0; }

  /* Arrange mode bar: compact two-line strip under the notch; DONE never shrinks or wraps. */
  .arrange-bar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 11; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px;
    align-items: center; background: rgba(42,34,16,.96); color: #f6f0dc; padding: 8px 14px 10px; font-size: 12px;

var CROSSING_SCORE = 100;

  ["up", 0, -1],

  ["right", 1, 0]

class FroggerModule {
  id = "H";

  over = false;

    }

      if (!input.isPressed(button)) {

    return this.lanes;

  checkHit() {
    if (!this.isCarAt(this.fx, this.fy)) {
      return;
    }
    this.livesLeft--;
    this.ctx.sound("crash");
    this.hitBlink = HIT_BLINK_STEPS;

      return;
    }

  }
}

// assets/scripts/games/jumper/JumperModule.ts
var CAMERA_ROW = 8;

var PLATFORMS_PER_SPEED_UP = 30;

class JumperModule {
  id = "G";

  clock = new StepClock;

  landings = 0;
  stepCount = 0;

  reset(ctx) {
    this.ctx = ctx;
    this.clock.reset();

    this.py = ROWS - 1 - PLAYER_SIZE;
    this.jumpStep = 0;
    this.squash = false;
    this.score = 0;

    this.over = false;

    }

      this.px = wrapCol(this.px - 1);
      this.ctx.sound("move");
    }
    if (input.isPressed("right")) {
      this.px = wrapCol(this.px + 1);
      this.ctx.sound("move");
    }
    const interval = STEP_FLOOR_MS + speedInterval(this.ctx.speed, STEP_SCALE2);
    const steps = this.clock.advance(dtMs, interval);
    let speedUp = false;
    for (let i = 0;i < steps && !this.over; i++) {

        speedUp = true;

    }

  }
  draw(frame, blinkPhase) {
    frame.clearPreview();
    for (const platform of this.platforms) {

          platform.x = wrapCol(platform.x + platform.dir);

      if (under) {
        return this.land(under);
      }

    this.py += delta;
    if (this.py < CAMERA_ROW) {
      this.scroll(CAMERA_ROW - this.py);
    }
    if (this.py > ROWS - 1) {

    }

  }

      this.score += PLATFORM_SCORE;
      this.landings++;

      const width = randomInt(this.ctx.rng, MIN_PLATFORM_WIDTH, MAX_PLATFORM_WIDTH);
      const kind = platformKindFor(level, this.ctx.rng());
      top = this.addPlatform(wrapCol(top.x + reach), top.y - gap, width, kind);
    }
  }
}

var CAR_SPRITE = [".#.", "###", ".#.", "#.#"];

var LANE_X = [1, 4, 7];
var RACING_GAP = [8, 7, 7, 6, 6, 5, 5, 4, 4, 4];
var PLAYER_Y = 16;
var SPAWN_Y = -4;
var OCCUPIED_WINDOW = 8;
var STEP_SCALE3 = 0.4;

function carsOverlap(ax, ay, bx, by) {
  for (let row = 0;row < CAR_SPRITE.length; row++) {
    const line = CAR_SPRITE[row];
    for (let col = 0;col < line.length; col++) {
      if (line[col] !== "#") {
        continue;
      }
      const localRow = ay + row - by;
      const localCol = ax + col - bx;
      if (localRow < 0 || localRow >= CAR_SPRITE.length) {
        continue;
      }
      if (localCol < 0 || localCol >= CAR_SPRITE[localRow].length) {
        continue;
      }
      if (CAR_SPRITE[localRow][localCol] === "#") {
        return true;
      }
    }
  }
  return false;
}
function kerbLit(y, scroll) {
  const phase = ((y - scroll) % 4 + 4) % 4;
  return phase < 3;
}

class RacingModule {
  id = "D";
  holdRepeat = { left: true, right: true };
  ctx;
  clock = new StepClock;
  scroll = 0;
  playerLane = 1;
  enemies = [];
  spawnCountdown = RACING_GAP[0];
  score = 0;
  passCount = 0;
  crashing = false;
  crashElapsedMs = 0;
  crashVisible = true;
  reset(ctx) {
    this.ctx = ctx;
    this.clock.reset();
    this.scroll = 0;
    this.playerLane = 1;
    this.enemies = [];
    this.spawnCountdown = this.gapForLevel();
    this.score = 0;
    this.passCount = 0;
    this.crashing = false;
    this.crashElapsedMs = 0;
    this.crashVisible = true;
  }
  update(dtMs, input) {
    if (this.crashing) {
      this.crashElapsedMs += dtMs;
      const toggles = Math.floor(this.crashElapsedMs / CRASH_TOGGLE_MS2);
      this.crashVisible = toggles % 2 === 0;
      const gameOver = this.crashElapsedMs >= CRASH_DURATION_MS2;
      return { score: this.score, gameOver, speedUp: false };
    }
    if (input.isPressed("left") && this.playerLane > 0) {
      this.playerLane -= 1;
      this.ctx.sound("move");
    }
    if (input.isPressed("right") && this.playerLane < LANE_X.length - 1) {
      this.playerLane += 1;
      this.ctx.sound("move");
    }
    const baseInterval = speedInterval(this.ctx.speed, STEP_SCALE3);
    const interval = input.isHeld("up") ? Math.round(baseInterval / 2) : baseInterval;
    const steps = this.clock.advance(dtMs, interval);
    let speedUp = false;
    for (let i = 0;i < steps; i++) {
      this.scroll = (this.scroll + 1) % 4;
      this.spawnCountdown -= 1;
      if (this.spawnCountdown <= 0) {
        this.spawnFairly();
        this.spawnCountdown = this.gapForLevel();
      }
      for (const enemy of this.enemies) {
        enemy.y += 1;
      }
      this.enemies = this.enemies.filter((enemy) => {
        if (enemy.y < ROWS) {
          return true;
        }
        this.score += PASS_SCORE;
        this.passCount += 1;
        this.ctx.sound("select");
        if (this.passCount % PASSES_PER_SPEED_UP === 0) {
          speedUp = true;
        }
        return false;
      });

    }
    frame.pen = LCD_COLOR.cyan;
    if (!this.crashing || this.crashVisible) {
      frame.blit(CAR_SPRITE, LANE_X[this.playerLane], PLAYER_Y);
    }
  }
  revive() {
    this.enemies = [];
    this.spawnCountdown = this.gapForLevel();
    this.crashing = false;
    this.crashElapsedMs = 0;
    this.crashVisible = true;
    this.clock.reset();
    return true;
  }
  spawnEnemy(lane, y) {
    if (!Number.isInteger(lane) || lane < 0 || lane >= LANE_X.length) {
      throw new Error(`lane ${lane} is not one of the ${LANE_X.length} lanes`);
    }

    return this.playerLane;
  }

  }

    const occupied = LANE_X.map((_, lane2) => this.laneOccupiedNearTop(lane2));

  }
  laneOccupiedNearTop(lane) {
    return this.enemies.some((enemy) => enemy.lane === lane && enemy.y < OCCUPIED_WINDOW);
  }
}

class SnakeModule {

  foodsEaten = 0;
  over = false;
  speedUpPending = false;
  clock = new StepClock;
  wallCells = [];
  wallSet = new Set;
  reset(ctx) {
    this.ctx = ctx;
    this.body = [
      { x: 5, y: 10 },
      { x: 4, y: 10 },
      { x: 3, y: 10 }
    ];

    this.nextDirection = "right";
    this.score = 0;
    this.foodsEaten = 0;
    this.over = false;

    this.spawnFood();
  }
  update(dtMs, input) {

    }

      this.handleInput(input);
      this.speedUpPending = false;
      const interval = speedInterval(this.ctx.speed, SPEED_SCALE);
      const steps = this.clock.advance(dtMs, interval);
      for (let i = 0;i < steps && !this.over; i++) {
        this.step();

    frame.pen = LCD_COLOR.blue;

      frame.set(cell.x, cell.y, true);
    }
    frame.pen = LCD_COLOR.green;
    for (const cell of this.body) {
      frame.set(cell.x, cell.y, true);
    }
    frame.pen = LCD_COLOR.red;
    if (blinkPhase) {
      frame.set(this.food.x, this.food.y, true);
    }

  }

    return { ...this.body[0] };
  }

    return this.body.map((c) => ({ ...c }));

  getFood() {
    return { ...this.food };
  }
  getFoodsEaten() {
    return this.foodsEaten;

  placeFood(x, y) {

  }

    const ctx = this.ctx;
    if (!ctx || this.over) {
      return;
    }
    this.direction = this.nextDirection;
    const vector = DIRECTION_VECTORS[this.direction];
    const head = this.body[0];
    const next = { x: head.x + vector.x, y: head.y + vector.y };
    if (!this.inBounds(next) || this.wallSet.has(key(next.x, next.y))) {
      this.over = true;
      ctx.sound("crash");
      return;
    }
    const willEat = next.x === this.food.x && next.y === this.food.y;
    const bodyToCheck = willEat ? this.body : this.body.slice(0, -1);
    if (bodyToCheck.some((c) => c.x === next.x && c.y === next.y)) {
      this.over = true;
      ctx.sound("crash");
      return;
    }
    this.body.unshift(next);
    if (willEat) {
      this.score += 10 * ctx.level;
      this.foodsEaten++;
      ctx.sound("eat");
      if (this.foodsEaten % FOODS_PER_SPEED_UP === 0) {
        this.speedUpPending = true;
      }
      this.spawnFood();
    } else {
      this.body.pop();
    }
  }
  inBounds(p) {
    return p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS;
  }
  revive() {
    const back = OPPOSITE[this.direction];
    const v = DIRECTION_VECTORS[back];
    const head = this.body[0] ?? { x: 5, y: 10 };
    let cells = [head, { x: head.x + v.x, y: head.y + v.y }, { x: head.x + 2 * v.x, y: head.y + 2 * v.y }];
    const blocked = (p) => !this.inBounds(p) || this.wallSet.has(key(p.x, p.y));
    if (cells.some(blocked)) {
      cells = [
        { x: 5, y: 10 },
        { x: 4, y: 10 },
        { x: 3, y: 10 }
      ];
      this.direction = "right";
      this.nextDirection = "right";
    } else {
      this.nextDirection = this.direction;
    }
    this.body = cells;
    const bodySet = new Set(cells.map((c) => key(c.x, c.y)));
    const candidates = [this.direction, ...DIRECTIONS.filter((d) => d !== this.direction && d !== OPPOSITE[this.direction]), OPPOSITE[this.direction]];
    for (const dir of candidates) {
      const step = DIRECTION_VECTORS[dir];
      const next = { x: cells[0].x + step.x, y: cells[0].y + step.y };
      if (!blocked(next) && !bodySet.has(key(next.x, next.y))) {
        this.direction = dir;

  }
  spawnFood() {
    const ctx = this.ctx;
    if (!ctx) {
      return;
    }
    const occupied = new Set(this.body.map((c) => key(c.x, c.y)));
    const free = [];
    for (let y = 0;y < ROWS; y++) {
      for (let x = 0;x < COLS; x++) {
        const k = key(x, y);
        if (!occupied.has(k) && !this.wallSet.has(k)) {

        }

    }
    if (free.length === 0) {
      return;
    }
    this.food = pick(ctx.rng, free);
  }
  drawPreview(frame) {
    const count = this.foodsEaten % PREVIEW_CELL_COUNT;
    frame.pen = LCD_COLOR.red;
    for (let i = 0;i < count; i++) {
      frame.setPreview(i % PREVIEW_SIZE, Math.floor(i / PREVIEW_SIZE), true);
    }
  }
}

// assets/scripts/games/tank/TankRules.ts
function boxesOverlap(a, b, size = 3) {
  return a.x < b.x + size && a.x + size > b.x && a.y < b.y + size && a.y + size > b.y;
}
function boxInBounds(x, y, size, cols, rows) {
  return x >= 0 && y >= 0 && x + size <= cols && y + size <= rows;
}
function cellLit(sprite, originX, originY, cellX, cellY) {
  const row = cellY - originY;
  const col = cellX - originX;
  if (row < 0 || row >= sprite.length) {
    return false;
  }
  const line = sprite[row];
  if (col < 0 || col >= line.length) {
    return false;
  }
  return line[col] === "#";
}
function chooseSpawnSlot(rng, slots, isOccupied) {
  const free = slots.filter((x) => !isOccupied(x));
  if (free.length === 0) {
    return null;
  }
  return pick(rng, free);
}

class TankModule {

    this.enemies = [];
    this.explosions = [];
    this.nextEnemyId = 1;
    this.score = 0;
    this.livesLeft = MAX_LIVES2;
    this.kills = 0;
    this.gameOver = false;
    this.pendingSpeedUp = false;
  }
  update(dtMs, input) {

    for (let i = 0;i < bulletSteps && !this.gameOver; i++) {

      frame.blit(TANK_SPRITES.down, enemy.x, enemy.y);
    }
    frame.pen = LCD_COLOR.cyan;
    if (this.invulnerableSteps === 0 || blinkPhase) {
      frame.blit(TANK_SPRITES[this.player.facing], this.player.x, this.player.y);
    }
    frame.pen = LCD_COLOR.yellow;
    for (const bullet of this.bullets) {
      frame.set(bullet.x, bullet.y, true);
    }
    frame.pen = LCD_COLOR.orange;
    if (blinkPhase) {
      for (const explosion of this.explosions) {
        frame.blit(EXPLOSION_SPRITE, explosion.x, explosion.y);
      }
    }
    frame.pen = LCD_COLOR.cyan;

  get playerPosition() {

  get bulletList() {
    return this.bullets;

  spawnEnemyAt(x, y) {

    if (this.enemies.some((enemy) => boxesOverlap({ x, y }, enemy))) {

    if (this.enemies.some((enemy) => boxesOverlap({ x: nx, y: ny }, enemy))) {

    const { dx, dy } = FACING_DELTA[this.player.facing];

      bullet.y += bullet.dy;
    }

    const playerBullet = this.bullets.find((b) => b.owner === "player");
    if (playerBullet) {
      const enemyBullet = this.bullets.find((b) => b.owner === "enemy" && b.x === playerBullet.x && b.y === playerBullet.y);
      if (enemyBullet) {
        this.bullets = this.bullets.filter((b) => b !== playerBullet && b !== enemyBullet);
      }
    }
    const survivingPlayerBullet = this.bullets.find((b) => b.owner === "player");
    if (survivingPlayerBullet) {
      const target = this.enemies.find((enemy) => cellLit(TANK_SPRITES.down, enemy.x, enemy.y, survivingPlayerBullet.x, survivingPlayerBullet.y));

        this.killEnemy(target);

  }
  revive() {

    this.player = { x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y, facing: "up" };
    this.enemies = this.enemies.filter((enemy) => !boxesOverlap(this.player, enemy, RESPAWN_CLEAR_SIZE));
    this.invulnerableSteps = RESPAWN_GRACE_STEPS;

  }

  }

    const ctx = this.requireCtx();

      if (!this.enemies.includes(enemy)) {

      if (roll < 0.6) {
        this.moveEnemyDown(enemy);
      } else if (roll < 0.9) {
        this.moveEnemySideways(enemy);
      } else {
        this.tryEnemyFire(enemy);
      }

    if (this.invulnerableSteps > 0) {
      this.invulnerableSteps--;

      const collided = this.enemies.find((enemy) => boxesOverlap(this.player, enemy));
      if (collided) {

    const blocked = this.enemies.some((other) => other !== enemy && boxesOverlap({ x: enemy.x, y: ny }, other));
    if (!blocked) {
      enemy.y = ny;
    }
  }
  moveEnemySideways(enemy) {
    const ctx = this.requireCtx();
    const dir = ctx.rng() < 0.5 ? -1 : 1;
    const nx = enemy.x + dir;
    if (!boxInBounds(nx, enemy.y, TANK_SIZE, COLS, ROWS)) {
      return;
    }
    const blocked = this.enemies.some((other) => other !== enemy && boxesOverlap({ x: nx, y: enemy.y }, other));
    if (!blocked) {
      enemy.x = nx;
    }
  }

    if (this.bullets.some((b) => b.owner === "enemy" && b.enemyId === enemy.id)) {

    }
    const front = frontOf(enemy, "down");

  }

    if (this.enemies.length >= cap) {
      return;
    }
    const slot = chooseSpawnSlot(ctx.rng, SPAWN_SLOTS, (x) => this.enemies.some((enemy) => boxesOverlap({ x, y: SPAWN_Y2 }, enemy)) || boxesOverlap({ x, y: SPAWN_Y2 }, this.player));
    if (slot === null) {
      return;
    }
    this.enemies.push({ id: this.nextEnemyId++, x: slot, y: SPAWN_Y2 });
  }
}

var REWARDED_SECONDS = 5;

function requireEl(id2) {

function createMockAdsProvider() {
  const els = {

    skip: requireEl("ad-skip"),
    close: requireEl("ad-close")

  let active = null;

    els.skip.hidden = true;
    els.close.hidden = true;
    resolve(result);

  els.close.addEventListener("click", () => finish("completed"));

      const total = kind === "rewarded" ? REWARDED_SECONDS : INTERSTITIAL_SECONDS;
      els.title.textContent = i18n.t(kind === "rewarded" ? "adContinueTitle" : "adInterstitialTitle");
      els.skip.textContent = i18n.t("adSkip");
      els.countdown.textContent = String(total);
      els.skip.hidden = true;
      els.close.hidden = kind !== "interstitial";
      els.overlay.hidden = false;
      let elapsedSeconds = 0;
      const interval = setInterval(() => {
        elapsedSeconds += 1;
        els.countdown.textContent = String(Math.max(0, total - elapsedSeconds));
        if (kind === "rewarded" && elapsedSeconds >= REWARDED_SKIP_AFTER_SECONDS) {
          els.skip.hidden = false;
        }
        if (elapsedSeconds >= total) {
          finish("completed");
        }

function createNativeAdsProvider() {

        resolve(result);
      }

    onAdReady(kind, ready) {

    isReady(kind) {

    },
    show(kind) {

        const id2 = String(nextId++);

      [x + t, y + h - t, w - 2 * t, t],
      [x, y + half + t, t, half - t],
      [x, y + t, t, half - t],
      [x + t, y + half, w - 2 * t, t]

  }
}

var REMOTE_CONFIG_KEY = "brick-game:remote-config";
var FETCH_TIMEOUT_MS = 4000;
function readCached(storage) {
  try {
    const raw = storage.getItem(REMOTE_CONFIG_KEY);
    return raw ? parseRemoteConfig(JSON.parse(raw)) : null;
  } catch {
    return null;
  }
}
function writeCache(storage, config) {
  try {
    storage.setItem(REMOTE_CONFIG_KEY, JSON.stringify(config));
  } catch {}
}
async function loadRemoteConfig(url, storage) {
  const cached = readCached(storage);
  if (typeof fetch !== "function") {
    return cached ?? DEFAULT_CONFIG;
  }
  const controller = new AbortController;
  const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(url, { signal: controller.signal });
    if (!res.ok) {
      throw new Error(`remote config fetch failed: ${res.status}`);
    }
    const json = await res.json();
    const parsed = parseRemoteConfig(json);
    writeCache(storage, parsed);
    return parsed;
  } catch {
    return cached ?? DEFAULT_CONFIG;
  } finally {
    clearTimeout(timer);
  }
}

function spriteCanvas(sprite, cell, color, target) {

  canvas.width = sprite[0].length * cell;
  canvas.height = sprite.length * cell;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = color;

      for (let x = 0;x < row.length; x++) {
        if (row[x] === "#") {
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }

    });
  }

}
function brickCanvas(sprite, cell, color) {
  const canvas = document.createElement("canvas");
  canvas.width = sprite[0].length * cell;
  canvas.height = sprite.length * cell;

  if (ctx) {
    const border = Math.max(2, Math.round(cell * 0.14));
    const core = cell - border * 4;
    ctx.fillStyle = color;
    sprite.forEach((row, y) => {
      for (let x = 0;x < row.length; x++) {
        if (row[x] !== "#") {
          continue;
        }
        const cx = x * cell;
        const cy = y * cell;
        ctx.fillRect(cx, cy, cell, border);
        ctx.fillRect(cx, cy + cell - border, cell, border);
        ctx.fillRect(cx, cy, border, cell);
        ctx.fillRect(cx + cell - border, cy, border, cell);
        ctx.fillRect(cx + border * 2, cy + border * 2, core, core);
      }
    });

}

class HtmlSoundPlayer {

    if (typeof Audio === "undefined") {
      return;

      audio.preload = "auto";
      this.clips.set(event, audio);
    }
  }
  unlock() {
    if (this.unlocked) {
      return;
    }
    this.unlocked = true;
    for (const clip of this.clips.values()) {
      const priming = clip.play();
      if (priming) {
        priming.then(() => clip.pause()).catch(() => {
          return;
        });
      }
      clip.currentTime = 0;
    }
  }
  play(event) {
    const clip = this.clips.get(event);
    if (this.muted || !clip) {
      return;
    }
    clip.currentTime = 0;
    clip.play().catch(() => {
      return;
    });
  }
  resume() {}
  setMuted(muted) {
    this.muted = muted;
  }
}
